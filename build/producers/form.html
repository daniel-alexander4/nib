<!doctype html>
<!-- P08.S02's form source: LibreOffice Writer/Web imports HTML controls as real form fields and exports them as
     widget annotations (measured — an ODF-authored control does not survive import). Rendered through LibreOffice. -->
<html lang="en"><head><meta charset="utf-8"><title>Form probe</title></head><body>
<h1>A form</h1>
<form>
<p><label for="n">Name</label> <input id="n" name="name" type="text" title="Your name"></p>
<p><input type="checkbox" name="agree" title="I agree"> I agree</p>
<p><input type="text" name="untitled"> A field with no description.</p>
</form>
</body></html>
